<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<header class="header">

<div class="logo">
🛠 Admin Dashboard
</div>

<div class="menu">
<a href="index.html">🏠 Home</a>
<a href="admin-orders.html">📦 Orders</a>
</div>

</header>

<div class="dashboard">

<div class="dash-card">
<h2 id="totalProducts">0</h2>
<p>Products</p>
</div>

<div class="dash-card">
<h2 id="totalOrders">0</h2>
<p>Orders</p>
</div>

<div class="dash-card">
<h2 id="totalSales">₹0</h2>
<p>Sales</p>
</div>

</div>

<div class="login-box">

<h2>Add Product</h2>

<input
type="text"
id="pname"
placeholder="Product Name">

<input
type="number"
id="pprice"
placeholder="Product Price">

<input
type="text"
id="pimage"
placeholder="Image URL">

<button onclick="previewImage()">
🖼 Preview Image
</button>

<br><br>

<img
id="preview"
src=""
width="120"
style="display:none;border-radius:10px;">

<br><br>

<button onclick="addProduct()">
➕ Add Product
</button>

</div>

<div class="search-box">

<input
type="text"
id="searchProduct"
placeholder="Search Product..."
onkeyup="searchProducts()">

</div>

<h2 class="title">
All Products
</h2>

<div id="productList"></div>

<script type="module" src="admin.js"></script>

</body>
</html>
